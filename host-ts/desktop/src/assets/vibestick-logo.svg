<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>Vibe Stick sound capsule</title>
  <rect width="256" height="256" rx="58" fill="#081522"/>
  <rect x="16" y="16" width="224" height="224" rx="48" stroke="#20DCE8" stroke-opacity=".2" stroke-width="3"/>

  <!-- A lighter outline keeps the microphone legible without a heavy filled silhouette. -->
