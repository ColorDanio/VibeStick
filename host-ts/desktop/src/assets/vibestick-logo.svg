  <!-- The pulse is the distinctive Vibe Stick detail. -->
  <path d="M99 113h16l10-21 13 34 10-20h16" stroke="#B6F7EE" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M55 126v8c0 40 33 72 73 72s73-32 73-72v-8" stroke="#20DCE8" stroke-width="15" stroke-linecap="round"/>
  <path d="M128 206v17M93 229h70" stroke="#20DCE8" stroke-width="15" stroke-linecap="round"/>
</svg>
