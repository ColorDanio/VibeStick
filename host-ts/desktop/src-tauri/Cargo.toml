[package]
name = "vibeconn"
version = "0.2.8"
description = "Vibe Stick desktop shell"
license = "MIT"
authors = ["VibeStick contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
