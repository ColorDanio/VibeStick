[env:m5stick-c]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5StickCPlus@^0.1.0
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.1.0

; M5StickS3 (ESP32-S3-PICO): ST7789P3 135x240, BMI270 IMU, M5PM1 PMU,
; ES8311 codec mic, KEY1=G11 KEY2=G12. Board differences are isolated in
; src/board.cpp behind VIBESTICK_BOARD_S3.
[env:m5stick-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DVIBESTICK_BOARD_S3=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@^0.2.5
    m5stack/M5PM1@^1.0.0
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.1.0
