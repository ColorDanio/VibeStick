[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibestick"
version = "0.1.0"
description = "Host daemon for the VibeStick M5StickC Plus AI-CLI session monitor"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
asr = [
    "faster-whisper",
    "numpy",
    "scipy",
]
app = [
    "pywebview",
]

[project.scripts]
# VibeConn is the stable product-facing name for the Python 1.x release.
# The historical vibestick-* commands remain supported for existing users.
vibeconnd = "vibestick.daemon:main"
vibeconn = "vibestick.app:main"
vibestickd = "vibestick.daemon:main"
vibestick-web = "vibestick.web:main"
vibestick-app = "vibestick.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibestick*"]
