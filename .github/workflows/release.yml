name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  base-artifacts:
    name: Firmware and Python artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-
      - name: Install build tools
        run: pip install platformio build
      - name: Build M5StickC Plus firmware
        run: pio run -d firmware -e m5stick-c
      - name: Build M5StickS3 firmware
        run: pio run -d firmware -e m5stick-s3
      - name: Run host tests
        run: |
          pip install -e "./host[dev]"
          python -m pytest host/tests/ -q
      - name: Build host package
        run: python -m build host/
      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          for d in firmware/.pio/build/*/; do
            env=$(basename "$d")
            cp "$d/firmware.bin" "dist-release/vibestick-firmware-${env}.bin"
          done
          cp host/dist/*.whl host/dist/*.tar.gz dist-release/
          ls -la dist-release/
      - name: Upload base release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibestick-base-release
          path: dist-release/*
          if-no-files-found: error

  host-ts-desktop:
    name: Vibe Stick desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux AMD64
            linux: true
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            linux: true
          - os: macos-15-intel
            label: macOS Intel
            linux: false
          - os: macos-14
            label: macOS Apple Silicon
            linux: false
          # Keep the release build aligned with CI: VS 2022 is detected by
          # node-gyp when compiling the native BLE dependency.
          - os: windows-2022
            label: Windows x64 (Windows 11)
            linux: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            host-ts/package-lock.json
            host-ts/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        if: matrix.linux
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Tauri prerequisites
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install and build Host 2.0 core
        run: |
          npm ci --prefix host-ts
          npm run build --prefix host-ts
      - name: Prepare Linux BLE helper runtime
        if: matrix.linux
        run: |
          python -m venv host/.venv
          host/.venv/bin/python -m pip install -e "./host[asr]"
      - name: Install desktop dependencies
        run: npm ci --prefix host-ts/desktop
      - name: Package Vibe Stick for Linux
        if: matrix.linux
        run: npm run package:deb --prefix host-ts/desktop
      - name: Package Vibe Stick for native platform
        if: '!matrix.linux'
        run: npm run package --prefix host-ts/desktop
      - name: Upload Vibe Stick release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibestick-host-2-${{ matrix.label }}-release
          path: |
            host-ts/desktop/src-tauri/target/release/bundle/**/*.AppImage
            host-ts/desktop/src-tauri/target/release/bundle/**/*.deb
            host-ts/desktop/src-tauri/target/release/bundle/**/*.dmg
            host-ts/desktop/src-tauri/target/release/bundle/**/*.msi
            host-ts/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [base-artifacts, host-ts-desktop]
    if: ${{ always() && needs.base-artifacts.result == 'success' && needs.host-ts-desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: List release artifacts
        run: ls -la dist-release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
