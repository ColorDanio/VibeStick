name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e "./host[dev]"
      - name: Run tests
        run: python -m pytest host/tests/ -q

  firmware-build:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibestick-firmware
          path: firmware/.pio/build/*/firmware.bin
          if-no-files-found: error
