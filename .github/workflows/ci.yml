name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vibeconn_implementation:
        description: "Implementation to validate (1 = stable release baseline, 2 = TypeScript refactor)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

jobs:
  host-ts-tests:
    name: VibeConn 2.0 core (TypeScript)
    if: github.event_name == 'workflow_dispatch' && inputs.vibeconn_implementation == '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host-ts/package-lock.json
      - name: Install Host 2.0 dependencies
        run: npm ci --prefix host-ts
      - name: Run Host 2.0 contract tests
        run: npm test --prefix host-ts

  host-ts-desktop:
    name: VibeConn 2.0 desktop (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.vibeconn_implementation == '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            host-ts/package-lock.json
            host-ts/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Host 2.0 dependencies
        run: npm ci --prefix host-ts
      - name: Build Host 2.0 core
        run: npm run build --prefix host-ts
      - name: Install desktop dependencies
        run: npm ci --prefix host-ts/desktop
      - name: Package current platform
        run: npm run package --prefix host-ts/desktop
      - name: Upload Tauri desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibestick-host-2-${{ matrix.label }}
          path: host-ts/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  host-tests:
    name: VibeConn 1.x tests (Python release baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e "./host[dev]"
      - name: Run tests
        run: python -m pytest host/tests/ -q

  firmware-build:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibestick-firmware
          path: firmware/.pio/build/*/firmware.bin
          if-no-files-found: error
